# /etc/rsyslog.d/30-samba-audit.conf (DC01) — WORKING version (v2, 2026-10-23)
# Routes Samba syslog output to dedicated files:
#   - JSON events (auth_json_audit)  -> /var/log/samba/audit.json  (raw %msg%, pure JSON per line)
#   - everything else (KDC text)     -> /var/log/samba/log.samba   (RFC3164-ized so the Wazuh
#     agent syslog parser accepts it)
#
# LESSONS (v1 was broken silently):
#   - v1 used legacy property filters with \" escapes -> rsyslog SKIPS the file on parse error
#     (rsyslogd -N1 reveals it) and messages fell through to default rules.
#   - Match the JSON by content, not by startswith "{": Samba syslog msg carries leading spaces.
#   - RepeatedMsgReduction must be off or identical KDC lines collapse.
#   - log.samba is written by BOTH samba (direct, raw) and rsyslog (prefixed). Fix ownership so
#     rsyslog (syslog user, adm group) can append: chown syslog:adm + chmod 664 log.samba, and
#     patch /etc/logrotate.d/samba: "create 640 root adm" -> "create 644 syslog adm".
#   - Verify with: rsyslogd -N1 ; logger -t samba test   (check both files)

$template SambaAudit,"%msg%\n"
$template SambaText,"%timegenerated% %HOSTNAME% samba: %msg%\n"
$RepeatedMsgReduction off
if $programname == "samba" then {
    if $msg contains "\"type\": \"" then {
        action(type="omfile" file="/var/log/samba/audit.json" template="SambaAudit")
    } else {
        action(type="omfile" file="/var/log/samba/log.samba" template="SambaText")
    }
    stop
}

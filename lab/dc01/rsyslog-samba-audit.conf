# /etc/rsyslog.d/30-samba-audit.conf (DC01)
# Routes Samba auth_json_audit + KDC syslog lines to a dedicated file.
# The template strips the syslog prefix so every line is pure JSON
# (required by the Wazuh agent log_format=json).
$template SambaAudit,"%msg%\n"
:programname, isequal, "samba" /var/log/samba/audit.json;SambaAudit
& stop

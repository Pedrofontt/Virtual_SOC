<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fd6"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f8a5f"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <style>
      .zoneTitle { font-size: 13px; font-weight: 600; }
      .card { fill: #ffffff; stroke-width: 1.2; }
      .cardTitle { font-size: 13.5px; font-weight: 700; fill: #16233d; }
      .cardIP { font-size: 12px; fill: #334155; }
      .cardBody { font-size: 11px; fill: #64748b; }
      .flow { font-size: 10.5px; fill: #475569; }
      .panelTitle { font-size: 14px; font-weight: 700; fill: #16233d; }
      .list { font-size: 11.5px; fill: #334155; }
      .phase { font-size: 11px; font-weight: 700; fill: #7c3aed; }
      .mono { font-family: Consolas, monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="1160" fill="#ffffff"/>

  <!-- Header -->
  <path d="M52 34 L78 34 L88 44 L88 70 L70 82 L52 70 L52 44 Z" fill="#1b4fd6"/>
  <circle cx="70" cy="56" r="7" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="106" y="60" font-size="30" font-weight="700" fill="#182a4a">Virtual SOC Lab — Data Flow Diagram (DFD)</text>
  <text x="106" y="88" font-size="14.5" fill="#5b6b85">Free-software, isolated, reproducible blue-team lab · VirtualBox 7.2.20 · Ubuntu 24.04.5 · Windows 11 Enterprise Eval</text>
  <rect x="1040" y="26" width="330" height="86" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1058" y="50" font-size="13" font-weight="700" fill="#16233d">Host (analyst workstation)</text>
  <text x="1058" y="72" font-size="12" fill="#475569">16 GB RAM · 512 GB disk · no bridged NICs</text>
  <text x="1058" y="91" font-size="12" fill="#475569">Memory Integrity OFF · hypervisorlaunchtype off</text>

  <!-- LAB-MGMT zone -->
  <rect x="40" y="130" width="1320" height="118" rx="14" fill="#f4f1ff" stroke="#8b7bf0" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="56" y="150" class="zoneTitle" fill="#5b46c9">LAB-MGMT · host-only 10.10.30.0/24 · static IPs, DHCP off</text>

  <rect x="60" y="162" width="280" height="68" rx="9" class="card" stroke="#8b7bf0"/>
  <text x="76" y="185" class="cardTitle">Host — analyst</text>
  <text x="76" y="204" class="cardIP mono">10.10.30.1</text>
  <text x="76" y="221" class="cardBody">Browser → Wazuh dashboard :443, n8n :5678</text>

  <rect x="380" y="162" width="280" height="68" rx="9" class="card" stroke="#8b7bf0"/>
  <text x="396" y="185" class="cardTitle">SOC01 — management NIC</text>
  <text x="396" y="204" class="cardIP mono">10.10.30.10</text>
  <text x="396" y="221" class="cardBody">Wazuh dashboard :443 · API :55000</text>

  <rect x="700" y="162" width="280" height="68" rx="9" class="card" stroke="#8b7bf0"/>
  <text x="716" y="185" class="cardTitle">SOAR01 — management NIC</text>
  <text x="716" y="204" class="cardIP mono">10.10.30.20</text>
  <text x="716" y="221" class="cardBody">n8n editor/API :5678</text>

  <rect x="1020" y="162" width="320" height="68" rx="9" fill="#ffffff" stroke="#d8d2f5" stroke-dasharray="4 4"/>
  <text x="1036" y="185" class="cardTitle" font-size="12.5">NAT adapters</text>
  <text x="1036" y="204" class="cardBody">Package installs only — detached after each build.</text>
  <text x="1036" y="221" class="cardBody">When detached, the lab has no Internet path.</text>

  <!-- LAB-CORP zone -->
  <rect x="40" y="270" width="540" height="430" rx="14" fill="#eaf4ff" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="56" y="290" class="zoneTitle" fill="#1f6fd6">LAB-CORP · int-corp 10.10.10.0/24 · no DHCP</text>

  <rect x="60" y="305" width="240" height="105" rx="9" class="card" stroke="#3b82f6"/>
  <text x="76" y="328" class="cardTitle">DC01 — Samba AD DC</text>
  <text x="76" y="347" class="cardIP mono">10.10.10.10</text>
  <text x="76" y="366" class="cardBody">corp.lab · DNS · LDAP/Kerberos</text>
  <text x="76" y="384" class="cardBody">users, groups, SPNs</text>
  <text x="76" y="401" class="cardBody">Phase 2 · Wazuh agent 002</text>

  <rect x="60" y="425" width="240" height="105" rx="9" class="card" stroke="#3b82f6"/>
  <text x="76" y="448" class="cardTitle">WIN01 — Windows 11 client</text>
  <text x="76" y="467" class="cardIP mono">10.10.10.20</text>
  <text x="76" y="486" class="cardBody">Sysmon (EIDs 1, 10, 22) + security log</text>
  <text x="76" y="504" class="cardBody">FIM: C:\lab\critical</text>
  <text x="76" y="521" class="cardBody">Phases 1–2–4 · Wazuh agent 001</text>

  <rect x="60" y="545" width="240" height="105" rx="9" class="card" stroke="#10b981"/>
  <text x="76" y="568" class="cardTitle">NDR01 — Suricata 8.x</text>
  <text x="76" y="587" class="cardIP mono">10.10.10.40</text>
  <text x="76" y="606" class="cardBody">Single-segment IDS (af-packet)</text>
  <text x="76" y="624" class="cardBody">eve.json alert events</text>
  <text x="76" y="641" class="cardBody">Phase 3 · Wazuh agent 003</text>

  <!-- LAB-SEC zone -->
  <rect x="620" y="270" width="520" height="430" rx="14" fill="#e8f7f0" stroke="#10b981" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="636" y="290" class="zoneTitle" fill="#0f8a5f">LAB-SEC · SIEM + automation</text>

  <rect x="640" y="305" width="480" height="120" rx="9" class="card" stroke="#0f8a5f"/>
  <text x="656" y="328" class="cardTitle">SOC01 — Wazuh 4.14.8 all-in-one</text>
  <text x="656" y="347" class="cardIP mono">10.10.10.5 (events :1514 · enroll :1515) · 10.10.30.10 (mgmt)</text>
  <text x="656" y="366" class="cardBody">Manager + Indexer + Dashboard · decoder/normalizer · 16 custom rules</text>
  <text x="656" y="384" class="cardBody">Rules 100010–100047 · ATT&amp;CK-mapped cases UC-00 … UC-13</text>
  <text x="656" y="402" class="cardBody">Integratord: custom-forward-to-n8n → rule_id 100047</text>
  <text x="656" y="419" class="cardBody">Agents: 000 SOC01 · 001 WIN01 · 002 DC01 · 003 NDR01</text>

  <rect x="640" y="475" width="480" height="120" rx="9" class="card" stroke="#7c3aed"/>
  <text x="656" y="498" class="cardTitle">SOAR01 — n8n 2.x (Docker)</text>
  <text x="656" y="517" class="cardIP mono">10.10.30.20 · webhook /webhook/soar</text>
  <text x="656" y="536" class="cardBody">7-node workflow: validate → VirusTotal domain → verdict → write</text>
  <text x="656" y="554" class="cardBody">Enrichment · incident creation · notification · audit trail</text>
  <text x="656" y="572" class="cardBody">Human approval gate for destructive actions</text>
  <text x="656" y="589" class="cardBody">Phase 4 · published workflow · outputs on /srv/soar</text>

  <rect x="640" y="620" width="480" height="62" rx="9" fill="#ffffff" stroke="#c4b5fd" stroke-dasharray="4 4"/>
  <text x="656" y="642" class="cardBody" font-size="11.5"><tspan class="mono" fill="#5b46c9">/srv/soar/incident.json</tspan> · <tspan class="mono" fill="#5b46c9">notification.json</tspan> · <tspan class="mono" fill="#5b46c9">audit.log</tspan></text>
  <text x="656" y="662" class="cardBody">Persisted evidence per enriched alert (severity, verdict, timestamps)</text>

  <!-- External -->
  <rect x="1180" y="390" width="180" height="170" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="1196" y="412" class="zoneTitle" fill="#c2410c">Internet (via NAT)</text>
  <text x="1196" y="436" class="cardTitle" font-size="12.5">VirusTotal API</text>
  <text x="1196" y="454" class="cardBody">Domain report endpoint</text>
  <text x="1196" y="471" class="cardBody">malicious / suspicious /</text>
  <text x="1196" y="488" class="cardBody">harmless / reputation</text>
  <text x="1196" y="512" class="cardBody" fill="#c2410c">Reachable only when the</text>
  <text x="1196" y="529" class="cardBody" fill="#c2410c">SOAR01 NAT adapter is</text>
  <text x="1196" y="546" class="cardBody" fill="#c2410c">temporarily attached.</text>

  <!-- Flows -->
  <line x1="300" y1="357" x2="640" y2="357" stroke="#1f6fd6" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="330" y="348" class="flow">auth / DNS events · agent 002 · :1514</text>

  <path d="M300 477 H520 V390 H640" fill="none" stroke="#1f6fd6" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="316" y="468" class="flow">logs / events (Sysmon, Security) · agent 001</text>

  <path d="M300 597 H560 V420 H640" fill="none" stroke="#0f8a5f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aGreen)"/>
  <text x="316" y="588" class="flow" fill="#0f8a5f">Suricata eve.json alerts · agent 003</text>

  <line x1="900" y1="425" x2="900" y2="475" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#aPurple)"/>
  <text x="914" y="444" class="flow" fill="#6d28d9">rule 100047 alert → n8n webhook</text>
  <text x="914" y="458" class="flow" fill="#6d28d9">integratord custom-forward-to-n8n</text>

  <line x1="1120" y1="535" x2="1180" y2="500" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#aOrange)"/>
  <text x="1124" y="556" class="flow" fill="#c2410c" font-size="9.5">HTTPS</text>

  <line x1="342" y1="196" x2="378" y2="196" stroke="#334155" stroke-width="1.6" marker-end="url(#aDark)"/>

  <!-- Bottom panels -->
  <rect x="40" y="720" width="680" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="746" class="panelTitle">Detection coverage — use case → Wazuh rule</text>

  <text x="60" y="776" class="phase">PHASE 1 · Detection core (S1)</text>
  <text x="60" y="796" class="list">UC-00  File integrity warm-up <tspan class="mono" fill="#1f6fd6">550 / 553 / 554</tspan></text>
  <text x="60" y="816" class="list">UC-01  T1003.001 LSASS access <tspan class="mono" fill="#1f6fd6">100010</tspan></text>
  <text x="60" y="836" class="list">UC-02  T1059.001 PowerShell -enc <tspan class="mono" fill="#1f6fd6">100020</tspan></text>

  <text x="60" y="868" class="phase">PHASE 2 · Identity (S2)</text>
  <text x="60" y="888" class="list">UC-03  T1110 failed logons / success <tspan class="mono" fill="#1f6fd6">100029–100031</tspan></text>
  <text x="60" y="908" class="list">UC-03b T1565.001 privileged group change <tspan class="mono" fill="#1f6fd6">100032</tspan></text>
  <text x="60" y="928" class="list">UC-04  T1558.003 Kerberoasting <tspan class="mono" fill="#1f6fd6">100033</tspan></text>
  <text x="60" y="948" class="list">UC-05  T1558.004 AS-REP roasting <tspan class="mono" fill="#1f6fd6">100034</tspan></text>

  <text x="380" y="776" class="phase">PHASE 3 · NDR (S3)</text>
  <text x="380" y="796" class="list">UC-06  NDR marker <tspan class="mono" fill="#0f8a5f">100040</tspan></text>
  <text x="380" y="816" class="list">UC-07  T1046 port scan <tspan class="mono" fill="#0f8a5f">100041</tspan></text>
  <text x="380" y="836" class="list">UC-08  T1571 beaconing <tspan class="mono" fill="#0f8a5f">100042</tspan></text>
  <text x="380" y="856" class="list">UC-09  T1095 ICMP tunnel <tspan class="mono" fill="#0f8a5f">100043</tspan></text>
  <text x="380" y="876" class="list">UC-10  T1071.004 DNS anomaly <tspan class="mono" fill="#0f8a5f">100044</tspan></text>
  <text x="380" y="896" class="list">UC-11  T1110 SMB brute force <tspan class="mono" fill="#0f8a5f">100045</tspan></text>
  <text x="380" y="916" class="list">UC-12  T1040 cleartext FTP <tspan class="mono" fill="#0f8a5f">100046</tspan></text>

  <text x="380" y="948" class="phase">PHASE 4 · SOAR (S4)</text>
  <text x="380" y="968" class="list">UC-13  T1071.004 DNS → VT enrichment <tspan class="mono" fill="#7c3aed">100047</tspan></text>
  <text x="380" y="988" class="list" fill="#64748b">Full chain: Sysmon EID 22 → Wazuh → n8n → VirusTotal</text>
  <text x="380" y="1008" class="list" fill="#64748b">→ incident + notification + audit (reproducible)</text>

  <text x="60" y="1030" class="list" font-weight="700" fill="#16233d">Success criterion</text>
  <text x="60" y="1050" class="list" fill="#475569">Every use case: documented attack → reproducible alert with evidence,</text>
  <text x="60" y="1070" class="list" fill="#475569">plus a benign control that stays silent. Cases live in <tspan class="mono">lab/cases/</tspan>.</text>
  <text x="60" y="1090" class="list" fill="#475569">Evidence in <tspan class="mono">lab/evidence/</tspan> (alert JSON + screenshots).</text>
  <text x="60" y="1116" class="list" font-weight="700" fill="#16233d">Replicate it</text>
  <text x="60" y="1135" class="list mono" fill="#475569">lab/runbook/setup.md  ·  lab/runbook/*-walkthrough.md  ·  lab/network/networks.md</text>

  <!-- Power-on -->
  <rect x="740" y="720" width="300" height="232" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="758" y="746" class="panelTitle">Power-on scenarios</text>
  <text x="758" y="766" class="list" fill="#64748b">Never exceed 11 GB of running guests.</text>
  <text x="758" y="792" class="list" font-weight="700">S1  SOC01 + WIN01 <tspan fill="#64748b" font-weight="400">· 9 GB</tspan></text>
  <text x="776" y="809" class="list" font-size="10.5" fill="#64748b">Phase 1 — detection core</text>
  <text x="758" y="833" class="list" font-weight="700">S2  + DC01 <tspan fill="#64748b" font-weight="400">· 11 GB</tspan></text>
  <text x="776" y="850" class="list" font-size="10.5" fill="#64748b">Phase 2 — identity</text>
  <text x="758" y="874" class="list" font-weight="700">S3  SOC01 + WIN01 + NDR01 <tspan fill="#64748b" font-weight="400">· 10 GB</tspan></text>
  <text x="776" y="891" class="list" font-size="10.5" fill="#64748b">Phase 3 — NDR</text>
  <text x="758" y="915" class="list" font-weight="700">S4  SOC01 + WIN01 + SOAR01 <tspan fill="#64748b" font-weight="400">· 11 GB</tspan></text>
  <text x="776" y="932" class="list" font-size="10.5" fill="#64748b">Phase 4 — automation</text>

  <!-- Legend -->
  <rect x="740" y="966" width="300" height="174" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="758" y="988" class="panelTitle">Legend</text>
  <line x1="760" y1="1004" x2="812" y2="1004" stroke="#1f6fd6" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="822" y="1008" class="list">Host / identity logs → SIEM</text>
  <line x1="760" y1="1026" x2="812" y2="1026" stroke="#0f8a5f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aGreen)"/>
  <text x="822" y="1030" class="list">Network IDS alerts → SIEM</text>
  <line x1="760" y1="1048" x2="812" y2="1048" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#aPurple)"/>
  <text x="822" y="1052" class="list">SIEM alert → SOAR webhook</text>
  <line x1="760" y1="1070" x2="812" y2="1070" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#aOrange)"/>
  <text x="822" y="1074" class="list">External API (NAT, demo only)</text>
  <line x1="760" y1="1092" x2="812" y2="1092" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="822" y="1096" class="list">Admin / analyst access</text>
  <text x="758" y="1118" class="list">Boot order: SOC01 first (wait for API),  then others.</text>
  <text x="758" y="1135" class="list">Shutdown in reverse. Snapshot each phase base.</text>

  <!-- Limitations -->
  <rect x="1060" y="720" width="300" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1078" y="746" class="panelTitle">Limitations (by design)</text>
  <text x="1078" y="772" class="list">· Simulated, benign activity only — no</text>
  <text x="1094" y="789" class="list">real malware required.</text>
  <text x="1078" y="812" class="list">· Samba AD ≠ Windows Server AD.</text>
  <text x="1078" y="835" class="list">· Wazuh + Sysmon ≠ commercial EDR.</text>
  <text x="1078" y="858" class="list">· Suricata = single-segment IDS, not a</text>
  <text x="1094" y="875" class="list">full NDR platform.</text>
  <text x="1078" y="898" class="list">· 16 GB host ⇒ phased power-on, not</text>
  <text x="1094" y="915" class="list">a 24/7 SOC.</text>
  <text x="1078" y="938" class="list">· Free-tool coverage ≠ commercial</text>
  <text x="1094" y="955" class="list">product parity.</text>
  <text x="1078" y="984" class="panelTitle" font-size="13">Not built / future</text>
  <text x="1078" y="1008" class="list" fill="#94a3b8">SRV01 (10.10.10.30, reserved)</text>
  <text x="1078" y="1029" class="list" fill="#94a3b8">MAIL01 / Proxmox Mail Gateway (ETP)</text>
  <text x="1078" y="1050" class="list" fill="#94a3b8">Velociraptor (evaluated, not deployed)</text>
  <text x="1078" y="1071" class="list" fill="#94a3b8">Shuffle (replaced by n8n)</text>
  <text x="1078" y="1100" class="list" font-weight="700" fill="#16233d">Phase 5 is not scheduled.</text>
  <text x="1078" y="1120" class="list" fill="#475569">All detections are reproducible from</text>
  <text x="1078" y="1137" class="list" fill="#475569"><tspan class="mono">lab/runbook/setup.md</tspan> + <tspan class="mono">lab/cases/</tspan>.</text>
</svg>
